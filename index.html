const parse=s=>s.trim().split('\n').map(l=>{const [cat,de,kana,jp]=l.split('|');return {cat,de,kana,jp}});const db={w:parse(rawW),p:parse(rawP)};const $=id=>document.getElementById(id),app=$('app');let store={best:{},stats:{},kana:true};try{let s=JSON.parse(localStorage.getItem('deutsch01'));if(s)store={...store,...s}}catch(e){}function save(){try{localStorage.setItem('deutsch01',JSON.stringify(store))}catch(e){}}let mode,type,rev,pool=[],idx=0,reveal=false,timer=null,deadline=0,score=0,wrong=0,locked=false,token=0,opts=[],current,cat='全ジャンル';const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function stop(){clearInterval(timer);timer=null;token++;try{speechSynthesis.cancel()}catch(e){}}function speak(t,rate){let n=$('notice');try{if(!('speechSynthesis'in window))throw Error();let v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase()==='de-de')||speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('de'));if(!v){if(n)n.textContent='ドイツ語音声が見つかりません。端末の音声設定をご確認ください。';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.voice=v;u.rate=rate;u.onerror=e=>{if(n&&e.error!=='canceled'&&e.error!=='interrupted')n.textContent='音声を再生できませんでした。'};speechSynthesis.speak(u)}catch(e){if(n)n.textContent='この端末では音声を利用できません。'}}try{speechSynthesis.getVoices()}catch(e){}function home(){stop();mode='home';app.innerHTML=`<div class="panel"><div class="de">Deutsch lernen</div><p>${db.w.length}語 ・ ${db.p.length}文</p><label><input type="checkbox" ${store.kana?'checked':''} onchange="store.kana=this.checked;save()"> 読みカナを表示</label></div><h2>練習モード</h2><div class="grid"><button onclick="setup('practice','w',false)">📖 単語練習</button><button onclick="setup('practice','p',false)">💬 日常会話練習</button></div><h2>テストモード</h2><div class="grid">${['w','p'].map(t=>[false,true].map(r=>`<button onclick="setup('test','${t}',${r})">${t==='w'?'単語':'会話'}テスト<br><small>${r?'日本語 → ドイツ語':'ドイツ語 → 日本語'}</small><br><small>最高 ${Object.entries(store.best).filter(([k])=>k.startsWith(t+':'+r+':')).reduce((m,[k,v])=>Math.max(m,v),0)} 点</small></button>`).join('')).join('')}</div><h2>復習</h2><div class="grid"><button onclick="setup('review','w',false)">苦手単語</button><button onclick="setup('review','p',false)">苦手会話</button></div>`}function setup(m,t,r){stop();mode=m;type=t;rev=r;cat='全ジャンル';app.innerHTML=`<button onclick="home()">‹ メニュー</button><div class="panel"><h2>${m==='test'?'60秒テスト':m==='review'?'苦手問題練習':'練習'}：${t==='w'?'単語':'日常会話'}</h2><label>ジャンル</label><select id="category" class="full">${['全ジャンル',...new Set(db[t].map(x=>x.cat))].map(c=>`<option>${esc(c)}</option>`).join('')}</select><p class="muted">${m==='test'?'4択・正解1点・不正解で5秒減少':'日本語を表示して意味を確認できます。'}</p><button class="primary full" onclick="start()">スタート</button><div id="notice" class="notice"></div></div>`}function start(){cat=$('category').value;beginRound()}function retry(){if(mode!=='result')return;mode='test';beginRound()}function beginRound(){stop();pool=db[type].filter(x=>cat==='全ジャンル'||x.cat===cat);if(mode==='review')pool=pool.filter(x=>(store.stats[x.de]?.wrong||0)>0);if(!pool.length){$('notice').textContent='対象の問題はまだありません。';return}pool=shuffle(pool);idx=0;reveal=false;if(mode==='test'){score=wrong=0;deadline=performance.now()+60000;question();timer=setInterval(tick,100)}else practice()}function audio(){return `<div class="row" style="justify-content:center;margin-top:14px"><button onclick="speak(current.de,1)">🔊 通常</button><button onclick="speak(current.de,.65)">🐢 ゆっくり</button></div><div id="notice" class="notice"></div>`}function card(x){return `<div class="de">${esc(x.de)}</div>${store.kana?`<div class="kana">${esc(x.kana)}</div>`:''}`}function practice(){current=pool[idx];app.innerHTML=`<div class="row"><button onclick="home()">‹ メニュー</button><span>${idx+1} / ${pool.length}</span></div><div class="panel"><div class="tag">${esc(current.cat)}</div>${card(current)}${audio()}<div class="jp">${reveal?esc(current.jp):'<button onclick="reveal=true;practice()">日本語を表示</button>'}</div></div><div class="row"><button onclick="move(-1)">‹ 前へ</button><button onclick="reveal=!reveal;practice()">意味を切替</button><button class="primary" onclick="move(1)">次へ ›</button></div>`}function move(d){idx=(idx+d+pool.length)%pool.length;reveal=false;practice()}function question(){if(performance.now()>=deadline){finish();return}locked=false;current=pool[idx];let field=rev?'de':'jp',seen=new Set([current[field]]),other=[];for(let x of shuffle([...pool,...db[type].filter(x=>!pool.includes(x))])){if(!seen.has(x[field])){seen.add(x[field]);other.push(x)}if(other.length===3)break}opts=shuffle([current,...other]);app.innerHTML=`<div class="row"><button onclick="home()">‹ 終了</button><span>正解 <b class="score">${score}</b></span><span id="time" class="score">60</span></div><div class="bar"><div id="bar"></div></div><div class="panel"><div class="tag">${rev?'ドイツ語を選択':'日本語を選択'}</div>${rev?`<div class="de">${esc(current.jp)}</div>`:card(current)}</div><div class="options">${opts.map((x,i)=>`<button id="opt${i}" onclick="choose(${i})">${esc(x[field])}${rev&&store.kana?`<br><small>${esc(x.kana)}</small>`:''}</button>`).join('')}</div><div id="notice" class="notice"></div>`;tick()}function tick(){let ms=Math.max(0,deadline-performance.now());if($('time')){$('time').textContent=Math.ceil(ms/1000)+'秒';$('bar').style.width=ms/600+'%'}if(ms<=0)finish()}function choose(i){if(locked||mode!=='test')return;if(performance.now()>=deadline){finish();return}locked=true;let ok=opts[i]===current;let s=store.stats[current.de]||{right:0,wrong:0};if(ok){score++;s.right++}else{wrong++;s.wrong++;deadline-=5000}store.stats[current.de]=s;save();opts.forEach((x,j)=>{let b=$('opt'+j);b.disabled=true;if(x===current)b.classList.add('good');else if(j===i)b.classList.add('bad')});$('notice').textContent=ok?'Richtig! 正解！':'不正解 −5秒';tick();if(mode!=='test')return;let stamp=token;setTimeout(()=>{if(stamp!==token||mode!=='test')return;idx++;if(idx>=pool.length){let prev=current;pool=shuffle(pool);if(pool.length>1&&pool[0]===prev)[pool[0],pool[1]]=[pool[1],pool[0]];idx=0}question()},ok?250:850)}function finish(){if(mode!=='test')return;stop();mode='result';let key=type+':'+rev+':'+cat;let best=store.best[key]||0;store.best[key]=Math.max(best,score);save();app.innerHTML=`<div class="panel"><h2>Zeit vorbei! 終了</h2><div class="score">${score} 点</div><p>不正解 ${wrong} 問</p><p>最高記録 ${store.best[key]} 点 ${score>best?'🎉 更新！':''}</p><button class="primary full" onclick="retry()">もう一度</button></div><button class="full" onclick="home()">メニューへ</button>`}home();</script></html>
