<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>たまごアクション Ver.0.3.1</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#17243b;color:white;font-family:system-ui,'Yu Gothic',sans-serif;touch-action:none}#app{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}#top{width:min(100vw,960px);min-height:56px;display:flex;justify-content:space-between;padding:0 12px;font-size:13px;align-items:center;gap:8px}#top>span:first-child{flex:1;min-width:0}#top>span:last-child{flex-shrink:0}#game{width:min(100vw,960px);height:auto;max-height:calc(100dvh - 185px);aspect-ratio:16/9;background:#b9e9ff;image-rendering:pixelated;border:2px solid #486785;border-radius:8px}#controls{width:min(100vw,960px);height:126px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:8px;user-select:none;-webkit-user-select:none}.group{display:flex;gap:10px;align-items:center}.btn{border:2px solid #ffffff70;background:#314d79;color:white;border-radius:18px;width:66px;height:74px;font-weight:800;font-size:19px;touch-action:none;box-shadow:0 5px 0 #10243f}.btn:active,.btn.pressed{background:#5882bd;transform:translateY(3px);box-shadow:0 2px 0 #10243f}.action{width:70px;border-radius:50%;font-size:15px}.attack{background:#a04a37}.swap{background:#6552a5}.skill{background:#ab7933}.btn:disabled{opacity:.45}.jump{background:#367a63}#hint{font-size:11px;color:#b9cee6;text-align:center;padding:0 5px}#restart{border:1px solid #a9bdd9;border-radius:7px;background:#314d79;color:white;padding:5px 10px} @media(max-width:580px){#controls{height:116px;padding:0 8px}.group{gap:6px}.btn{width:50px;height:65px}.action{width:59px}#game{max-height:calc(100dvh - 185px)}#top{font-size:11px;min-height:76px}}
</style></head><body><div id="app"><div id="top"><span>🐉 たまごアクション Ver.0.3.1　<span id="hp">HP: ♥♥♥♥♥</span></span><span><span id="state">草原ステージ</span>　<button id="restart">最初から</button></span></div><canvas id="game" width="960" height="540" aria-label="横スクロールアクションゲーム"></canvas><div id="controls"><div class="group"><button class="btn" data-key="left">◀</button><button class="btn" data-key="right">▶</button></div><div class="group"><button class="btn action swap" data-key="swap">交代</button><button class="btn action skill" data-key="skill">技</button><button class="btn action jump" data-key="jump">ジャンプ</button><button class="btn action attack" data-key="attack">攻撃</button></div></div><div id="hint">MP不足時は攻撃不可・回避中もMP回復 ｜ PC：← → 移動 / Space ジャンプ / Z 攻撃 / X 技 / C 交代</div></div><script>
(()=>{'use strict';const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),hpText=document.querySelector('#hp'),stateText=document.querySelector('#state');const W=960,H=540,WORLD=3800,GROUND=440;let keys={left:false,right:false,jump:false,attack:false,skill:false,swap:false},player,enemies,shots,boss,camera,phase,frame,shake,team,active,swapCD,swapHeld,skillHeld;const MAX_SWAP_CD=32;
// 調整値：将来の育成データ連携時は roster の能力値と技設定を差し替える。
const BAL={nearNormal:1,farNormal:.55,nearSkill:2.5,farSkill:1.4,nearNormalMp:1,farNormalMp:3,nearSkillMp:12,farSkillMp:18,defScale:90,moveBase:-1.1,moveAgility:.08,moveMin:2.7,moveMax:7.0,regenBase:.003,regenAgility:.00017,benchMultiplier:1.5};
const roster=[
{name:'青ドラゴン',maxHp:230,maxMp:60,strength:65,wisdom:110,defense:45,agility:90,normal:{type:'far',cost:BAL.farNormalMp},skill:{name:'火炎弾',type:'far',cost:BAL.farSkillMp}},
{name:'赤い騎士',maxHp:300,maxMp:45,strength:115,wisdom:45,defense:95,agility:55,normal:{type:'near',cost:BAL.nearNormalMp},skill:{name:'剣撃',type:'near',cost:BAL.nearSkillMp}}
];
const moveSpeed=t=>clamp(BAL.moveBase+t.agility*BAL.moveAgility,BAL.moveMin,BAL.moveMax);
const mpRegen=(t,bench)=> (BAL.regenBase+t.agility*BAL.regenAgility)*(bench?BAL.benchMultiplier:1);
const attackPower=(t,skill)=>{const a=skill?t.skill:t.normal;const factor=a.type==='near'?(skill?BAL.nearSkill:BAL.nearNormal):(skill?BAL.farSkill:BAL.farNormal);return Math.max(1,Math.round((a.type==='near'?t.strength:t.wisdom)*factor));};
const damageTaken=(raw,defense)=>Math.max(1,Math.round(raw*BAL.defScale/(BAL.defScale+defense)));
const platforms=[{x:470,y:360,w:200,h:22},{x:850,y:315,w:175,h:22},{x:1280,y:355,w:190,h:22},{x:1690,y:320,w:190,h:22},{x:2100,y:365,w:185,h:22},{x:2540,y:325,w:190,h:22},{x:2970,y:350,w:180,h:22}];const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));function reset(){team=roster.map((r,i)=>({...r,hp:r.maxHp,mp:r.maxMp,id:i}));active=0;swapCD=0;swapHeld=false;skillHeld=false;player={x:90,y:GROUND-56,w:47,h:56,vx:0,vy:0,dir:1,grounded:false,inv:0,attackCD:0,jumpHeld:false};enemies=[420,750,1080,1460,1790,2170,2440,2830,3100].map((x,i)=>({x,y:GROUND-39,w:43,h:39,hp:i%3===0?210:140,origin:x,dir:i%2?1:-1,alive:true,hit:0}));shots=[];boss={x:3490,y:GROUND-115,w:100,h:115,hp:1200,maxHp:1200,alive:true,dir:-1,shotCD:65,hit:0};camera=0;phase='play';frame=0;shake=0;stateText.textContent='草原ステージ';updateHp()}function updateHp(){const t=team[active],b=team[1-active];hpText.textContent=`${t.name} HP:${t.hp}/${t.maxHp} MP:${Math.floor(t.mp)}/${t.maxMp} ｜控え ${b.name} HP:${b.hp}/${b.maxHp} MP:${Math.floor(b.mp)}/${b.maxMp}`}function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function damage(){if(player.inv||phase!=='play')return;const t=team[active];t.hp=Math.max(0,t.hp-damageTaken(48,t.defense));player.inv=85;shake=0;player.vy=-5;player.vx=-player.dir*5;if(t.hp<=0){if(team[1-active].hp>0){swapTo(1-active,true)}else{phase='lose';stateText.textContent='ゲームオーバー'}}updateHp()}function fire(){const t=team[active],a=t.normal;if(player.attackCD>0||t.mp<a.cost)return;
t.mp=Math.max(0,t.mp-a.cost);player.attackCD=a.type==='far'?18:14;
spawnAttack(a.type,attackPower(t,false),false);updateHp()}
function spawnAttack(type,power,skill){const near=type==='near';shots.push({x:player.x+player.w/2+player.dir*(near?(skill?60:44):30),y:player.y+26,vx:player.dir*(near?(skill?7:5):(skill?14:12)),r:near?(skill?55:31):(skill?19:9),damage:power,owner:'player',life:near?(skill?8:5):80,melee:near})}
function swapTo(next,forced=false){if(!forced&&(swapCD>0||team[next].hp<=0))return false;active=next;swapCD=forced?MAX_SWAP_CD:MAX_SWAP_CD;player.inv=Math.max(player.inv,forced?75:16);player.attackCD=10;updateHp();return true}function useSkill(){const t=team[active],a=t.skill;if(t.mp<a.cost||player.attackCD>0)return;
t.mp=Math.max(0,t.mp-a.cost);player.attackCD=26;spawnAttack(a.type,attackPower(t,true),true);updateHp()}
function update(){frame++;if(phase!=='play')return;player.inv=Math.max(0,player.inv-1);player.attackCD=Math.max(0,player.attackCD-1);swapCD=Math.max(0,swapCD-1);for(let i=0;i<2;i++)team[i].mp=Math.min(team[i].maxMp,team[i].mp+mpRegen(team[i],i!==active));if(keys.swap&&!swapHeld)swapTo(1-active);swapHeld=keys.swap;if(keys.skill&&!skillHeld)useSkill();skillHeld=keys.skill;if(keys.attack)fire();if(frame%12===0)updateHp();const speed=moveSpeed(team[active]);player.vx=keys.left&&!keys.right?-speed:keys.right&&!keys.left?speed:player.vx*.72;if(Math.abs(player.vx)<.2)player.vx=0;if(player.vx)player.dir=Math.sign(player.vx);if(keys.jump&&!player.jumpHeld&&player.grounded){player.vy=-13.4;player.grounded=false}player.jumpHeld=keys.jump;const oldBottom=player.y+player.h;player.vy=Math.min(15,player.vy+.62);player.x=clamp(player.x+player.vx,0,WORLD-player.w);player.y+=player.vy;player.grounded=false;if(player.y+player.h>=GROUND){player.y=GROUND-player.h;player.vy=0;player.grounded=true}for(const p of platforms){if(player.vy>=0&&player.x+player.w>p.x+7&&player.x<p.x+p.w-7&&oldBottom<=p.y+12&&player.y+player.h>=p.y){player.y=p.y-player.h;player.vy=0;player.grounded=true}}for(const e of enemies){if(!e.alive)continue;e.x+=e.dir*.85;if(Math.abs(e.x-e.origin)>65)e.dir*=-1;e.hit=Math.max(0,e.hit-1);if(overlap(player,e))damage()}if(boss.alive&&player.x>WORLD-1150){boss.shotCD--;if(boss.shotCD<=0){boss.shotCD=65;shots.push({x:boss.x,y:boss.y+38,vx:-6,r:13,owner:'boss',life:180})}if(overlap(player,boss))damage()}boss.hit=Math.max(0,boss.hit-1);for(const s of shots){s.x+=s.vx;s.life--;if(s.owner==='player'){for(const e of enemies){if(e.alive&&circleRect(s,e)){e.hp-=s.damage||1;e.hit=8;s.life=0;if(e.hp<=0)e.alive=false;break}}if(boss.alive&&circleRect(s,boss)){boss.hp-=s.damage||1;boss.hit=8;s.life=0;if(boss.hp<=0){boss.alive=false;phase='win';stateText.textContent='ステージクリア！'}}}else if(circleRect(s,player)){s.life=0;damage()}}shots=shots.filter(s=>s.life>0&&s.x>=0&&s.x<WORLD);camera=clamp(player.x-W*.38,0,WORLD-W);shake=Math.max(0,shake-1)}function circleRect(c,r){const px=clamp(c.x,r.x,r.x+r.w),py=clamp(c.y,r.y,r.y+r.h);return (c.x-px)**2+(c.y-py)**2<c.r**2}function box(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),w,h)}function draw(){ctx.save();const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#8ad9ff');sky.addColorStop(1,'#f3fce8');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff9';for(let i=0;i<18;i++){const x=((i*251-camera*.2)%(W+260)+W+260)%(W+260)-90,y=45+(i*47)%165;ctx.beginPath();ctx.ellipse(x,y,52,17,0,0,Math.PI*2);ctx.ellipse(x+28,y-9,34,20,0,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#88c99b';for(let i=0;i<18;i++){let x=i*255-camera*.45;ctx.beginPath();ctx.ellipse(x+50,GROUND+6,170,150,0,Math.PI,0);ctx.fill()}ctx.save();ctx.translate(-camera,0);box(0,GROUND,WORLD,H-GROUND,'#906d48');box(0,GROUND,WORLD,16,'#65b94e');for(let x=0;x<WORLD;x+=55){box(x,GROUND+37,20,8,'#b99361');box(x+28,GROUND+75,12,8,'#705438')}for(const p of platforms){box(p.x,p.y,p.w,p.h,'#8d6b4b');box(p.x,p.y,p.w,9,'#6ac95b');box(p.x+15,p.y+17,p.w-30,5,'#6f533c')}for(let x=110;x<WORLD-350;x+=195){box(x,GROUND-18,5,18,'#3c9753');ctx.fillStyle=x%2?'#ffdf60':'#f47f9d';ctx.beginPath();ctx.arc(x+2,GROUND-20,8,0,Math.PI*2);ctx.fill()}for(const e of enemies){if(!e.alive)continue;ctx.fillStyle=e.hit?'#fff':'#ba664e';ctx.beginPath();ctx.ellipse(e.x+e.w/2,e.y+e.h/2,e.w/2,e.h/2,0,0,Math.PI*2);ctx.fill();box(e.x+10,e.y+12,6,7,'#fff');box(e.x+27,e.y+12,6,7,'#fff');box(e.x+12,e.y+14,3,4,'#242638');box(e.x+29,e.y+14,3,4,'#242638')}if(boss.alive){ctx.fillStyle=boss.hit?'#fff':'#5e4b9c';ctx.beginPath();ctx.roundRect(boss.x,boss.y,boss.w,boss.h,25);ctx.fill();ctx.fillStyle='#d7c0fa';ctx.beginPath();ctx.moveTo(boss.x+13,boss.y+8);ctx.lineTo(boss.x+3,boss.y-28);ctx.lineTo(boss.x+36,boss.y+5);ctx.moveTo(boss.x+68,boss.y+5);ctx.lineTo(boss.x+95,boss.y-28);ctx.lineTo(boss.x+92,boss.y+16);ctx.fill();box(boss.x+22,boss.y+34,15,13,'#fff');box(boss.x+62,boss.y+34,15,13,'#fff');box(boss.x+29,boss.y+37,7,8,'#241d36');box(boss.x+65,boss.y+37,7,8,'#241d36');box(boss.x,boss.y-42,100,12,'#3b2c46');box(boss.x,boss.y-42,100*boss.hp/boss.maxHp,12,'#f17474')}if(!(player.inv&&frame%6<3)){ctx.save();ctx.translate(player.x+player.w/2,player.y);ctx.scale(player.dir,1);if(active===1){ctx.fillStyle='#a83f40';ctx.beginPath();ctx.roundRect(-22,8,44,48,8);ctx.fill();ctx.fillStyle='#e9c6a5';ctx.fillRect(-14,18,28,17);ctx.fillStyle='#c3cbd9';ctx.fillRect(-24,0,48,16);ctx.fillStyle='#777e92';ctx.fillRect(-10,-12,20,15);ctx.fillStyle='#fff';ctx.fillRect(3,22,7,6);ctx.fillStyle='#222';ctx.fillRect(7,23,3,4);ctx.fillStyle='#e9e3bb';ctx.fillRect(18,32,31,7);ctx.fillStyle='#a6c8df';ctx.fillRect(39,24,12,23);ctx.fillStyle='#6b3439';ctx.fillRect(-17,52,14,6);ctx.fillRect(6,52,14,6);ctx.restore()}else{ctx.fillStyle='#3675cf';ctx.beginPath();ctx.moveTo(-15,28);ctx.lineTo(-36,13);ctx.lineTo(-28,43);ctx.fill();ctx.fillStyle='#4aa9e9';ctx.beginPath();ctx.roundRect(-23,6,46,49,14);ctx.fill();ctx.fillStyle='#81d9ff';ctx.beginPath();ctx.moveTo(-15,12);ctx.lineTo(-9,-5);ctx.lineTo(1,11);ctx.lineTo(11,-7);ctx.lineTo(20,13);ctx.fill();box(2,23,11,10,'white');box(9,25,5,7,'#142d55');ctx.fillStyle='#f2d2a4';ctx.beginPath();ctx.ellipse(23,36,13,8,0,0,Math.PI*2);ctx.fill();box(-16,52,13,5,'#2b568c');box(6,52,13,5,'#2b568c');ctx.restore()}}for(const s of shots){ctx.fillStyle=s.owner==='player'?'#ffad40':'#ed7cf7';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff4';ctx.lineWidth=3;ctx.stroke()}ctx.restore();box(15,15,190,14,'#344b65');box(15,15,190*team[active].hp/team[active].maxHp,14,'#f36b72');ctx.strokeStyle='white';ctx.strokeRect(15,15,190,14);box(15,34,190,8,'#263d64');box(15,34,190*team[active].mp/team[active].maxMp,8,'#6cc8f3');ctx.fillStyle='#263a57';ctx.font='bold 15px system-ui';ctx.fillText('進行度 '+Math.round(player.x/(WORLD-120)*100)+'%　交代 '+(swapCD?'待機':'OK')+'　力'+team[active].strength+' 賢'+team[active].wisdom+' 防'+team[active].defense+' 速'+team[active].agility,15,65);if(phase!=='play'){ctx.fillStyle='#14243dcc';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 58px system-ui';ctx.fillText(phase==='win'?'ステージクリア！':'ゲームオーバー',W/2,H/2-15);ctx.font='26px system-ui';ctx.fillText('「最初から」で再挑戦',W/2,H/2+45);ctx.textAlign='left'}ctx.restore()}let last=0,acc=0;function loop(t){acc+=Math.min(60,t-last||16.7);last=t;let steps=0;while(acc>=16.666&&steps<4){update();acc-=16.666;steps++}draw();requestAnimationFrame(loop)}const map={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',ArrowUp:'jump',KeyZ:'attack',KeyJ:'attack',KeyX:'skill',KeyC:'swap'};window.addEventListener('keydown',e=>{const k=map[e.code];if(k){e.preventDefault();keys[k]=true}});window.addEventListener('keyup',e=>{const k=map[e.code];if(k){e.preventDefault();keys[k]=false}});window.addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const active=new Set();function sync(){keys[k]=active.size>0;b.classList.toggle('pressed',keys[k])}b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);active.add(e.pointerId);sync()});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,e=>{active.delete(e.pointerId);sync()})});document.querySelector('#restart').addEventListener('click',reset);reset();requestAnimationFrame(loop)})();
</script></body></html>
